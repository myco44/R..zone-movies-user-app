<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Movie Library</title><style>  :root{    --bg:#0a0c12; --surface:#151824; --surface2:#1c2032;    --gold:#1ca9e0; --gold-dim:#0d5a78; --red:#e0463c;    --ok:#4caf6d; --wait:#e0463c; --soon:#38bdf8;    --text:#ffffff; --muted:#7f93b3; --rule:#252a3d;  }  *{box-sizing:border-box;}  body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,serif;min-height:100vh;}  .wrap{max-width:520px;margin:0 auto;padding-bottom:70px;}  header{padding:26px 20px 14px;text-align:center;border-bottom:2px solid var(--rule);}  h1{font-family:'Impact','Arial Black',sans-serif;letter-spacing:2px;     background:linear-gradient(90deg, var(--red) 0%, var(--red) 35%, var(--gold) 65%, var(--gold) 100%);     -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold);     text-transform:uppercase;font-size:26px;margin:0 0 4px;filter:drop-shadow(0 0 10px rgba(28,169,224,0.35));}  .sub{color:var(--muted);font-size:12px;letter-spacing:1px;}  main{padding:18px;}  .auth-box{padding:40px 20px;text-align:center;}  .auth-box p{color:var(--muted);font-size:13px;margin-bottom:16px;}  input,select{width:100%;padding:13px;background:var(--surface);border:1px solid var(--rule);    color:var(--text);border-radius:8px;font-size:15px;font-family:Georgia,serif;margin-bottom:10px;}  input::placeholder{color:var(--muted);}  .btn{width:100%;padding:13px;background:var(--gold);color:#ffffff;border:none;border-radius:8px;       font-weight:bold;font-size:14px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}  .btn.secondary{background:transparent;color:var(--gold);border:1px solid var(--gold-dim);margin-top:8px;}  .link-toggle{color:var(--gold);font-size:12px;text-decoration:underline;cursor:pointer;margin-top:12px;display:inline-block;}  .msg{text-align:center;font-size:12px;color:var(--wait);margin-top:8px;min-height:16px;}  .tabs{display:flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:18px;}  .tabs button{flex:1;padding:11px 4px;background:var(--surface);color:var(--muted);               border:none;font-size:12px;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;font-family:inherit;}  .tabs button.active{background:var(--gold);color:#ffffff;font-weight:bold;}  .section{display:none;}  .section.active{display:block;}  .cat-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px;}  .cat-chip{flex-shrink:0;padding:8px 16px;background:var(--surface);border:1px solid var(--rule);            border-radius:999px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;}  .cat-chip.active{background:var(--gold);color:#ffffff;border-color:var(--gold);font-weight:bold;    box-shadow:0 0 10px rgba(28,169,224,0.5);}  .card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;margin-bottom:14px;    box-shadow:0 6px 18px rgba(0,0,0,0.35);transition:transform 0.15s ease;}  .card:active{transform:scale(0.99);}  .thumb{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;margin-bottom:10px;    border:1px solid var(--rule);box-shadow:0 8px 20px rgba(0,0,0,0.45);}  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}  .card-title{font-size:17px;font-weight:800;color:#ffffff;letter-spacing:0.3px;text-shadow:0 1px 6px rgba(0,0,0,0.6);}  .card-meta{color:var(--muted);font-size:12px;margin-top:4px;}  .card-desc{color:#a9c3e8;font-size:13px;margin-top:8px;line-height:1.4;}  .stamp{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:4px 8px;border-radius:999px;         font-family:Arial,sans-serif;font-weight:bold;border:2px solid;white-space:nowrap;}  .stamp.ipo{color:var(--ok);border-color:var(--ok);box-shadow:0 0 8px rgba(76,175,109,0.35);}  .stamp.bado{color:var(--wait);border-color:var(--wait);box-shadow:0 0 8px rgba(224,70,60,0.4);}  .stamp.inakuja{color:var(--soon);border-color:var(--soon);box-shadow:0 0 8px rgba(56,189,248,0.4);}  .like-btn{    display:inline-flex;align-items:center;gap:6px;    background:var(--surface2);border:1px solid var(--rule);color:var(--muted);    border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer;margin-top:10px;    transition:transform 0.15s ease, border-color 0.2s ease, color 0.2s ease;  }  .like-btn:active{transform:scale(0.92);}  .like-btn .heart-icon{font-size:16px;line-height:1;transition:transform 0.25s cubic-bezier(.34,1.56,.64,1);}  .like-btn.liked{color:#ff4d6d;border-color:#ff4d6d;background:rgba(255,77,109,0.08);}  .like-btn.liked .heart-icon{transform:scale(1.25);}  .like-btn.pop .heart-icon{animation:heartPop 0.4s ease;}  @keyframes heartPop{    0%{transform:scale(1);}    35%{transform:scale(1.5);}    60%{transform:scale(0.9);}    100%{transform:scale(1.25);}  }  .section-label{    font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);    margin:18px 0 10px;font-weight:bold;display:flex;align-items:center;gap:8px;  }  .section-label::before{content:'';width:14px;height:2px;background:var(--gold);display:inline-block;}  .ads-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;}  .ad-card{flex-shrink:0;width:260px;background:var(--surface);border:1px solid var(--rule);    border-radius:10px;overflow:hidden;}  .ad-card img{width:100%;height:130px;object-fit:cover;display:block;}  .ad-card .ad-text{padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.4;}  .ad-text-only{background:linear-gradient(135deg, var(--surface2), var(--surface));    border:1px solid var(--gold-dim);border-radius:10px;padding:14px 16px;margin-bottom:14px;    font-size:13px;color:var(--text);line-height:1.5;}  .ad-text-only::before{content:'\1F4E2 ';}  .top-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;}  .top-card{flex-shrink:0;width:140px;background:var(--surface);border:1px solid var(--rule);    border-radius:12px;overflow:hidden;position:relative;box-shadow:0 6px 16px rgba(0,0,0,0.4);}  .top-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;}  .top-card .rank-badge{position:absolute;top:6px;left:6px;background:var(--gold);color:#ffffff;    font-weight:bold;font-size:11px;border-radius:999px;width:22px;height:22px;    display:flex;align-items:center;justify-content:center;}  .top-card .top-title{padding:8px 10px;font-size:12px;font-weight:bold;}  .top-card .top-likes{padding:0 10px 8px;font-size:11px;color:var(--muted);}  .search-wrap{margin-bottom:14px;}  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px;}  .logout-bar{display:flex;justify-content:space-between;align-items:center;padding:0 18px;margin-top:-10px;margin-bottom:6px;}  .logout-bar button{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;}  .topbar-avatar{display:flex;align-items:center;gap:8px;cursor:pointer;}  .topbar-avatar img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--gold, #e8b93c);}  .topbar-avatar .topbar-placeholder{width:34px;height:34px;border-radius:50%;background:var(--surface2,#1f2330);    border:2px solid var(--gold, #e8b93c);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;}  .topbar-avatar .topbar-name{font-size:12px;color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}  .banned-box{padding:60px 20px;text-align:center;color:var(--wait);}  .trailer-btn{background:linear-gradient(135deg, #ff5347, var(--red-dim, #7a241f));border:none;color:#ffffff;    border-radius:999px;padding:10px 18px;font-size:12px;font-weight:800;letter-spacing:0.4px;    text-transform:uppercase;cursor:pointer;margin-top:10px;margin-right:8px;    display:inline-flex;align-items:center;gap:7px;box-shadow:0 4px 14px rgba(224,70,60,0.45);    transition:transform 0.15s ease, box-shadow 0.15s ease;}  .trailer-btn:active{transform:scale(0.95);box-shadow:0 2px 8px rgba(224,70,60,0.55);}  .actions-row{display:flex;flex-wrap:wrap;align-items:center;}  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;    align-items:center;justify-content:center;padding:20px;}  .modal-overlay.open{display:flex;}  .modal-box{width:100%;max-width:480px;background:#000;border-radius:10px;overflow:hidden;position:relative;}  .modal-box iframe{width:100%;aspect-ratio:16/9;display:block;border:none;}  .modal-close{position:absolute;top:-40px;right:0;background:none;border:none;color:var(--text);    font-size:24px;cursor:pointer;}  /* Emergency banner */  .emergency-banner{    background:linear-gradient(135deg, #4a1010, #2a0a0a);border:1px solid var(--wait);    border-radius:10px;padding:14px 16px;margin-bottom:14px;color:#ffb3b3;font-size:13px;    line-height:1.5;display:flex;gap:10px;align-items:flex-start;  }  .emergency-banner .icon{font-size:18px;flex-shrink:0;}  /* Share button */  .share-btn{    background:var(--surface2);border:1px solid var(--rule);color:var(--muted);border-radius:999px;    padding:8px 14px;font-size:12px;cursor:pointer;margin-top:10px;  }  /* Comments */  .comments-toggle{    background:none;border:none;color:var(--gold);font-size:12px;cursor:pointer;margin-top:10px;    text-decoration:underline;padding:0;  }  .comments-section{display:none;margin-top:10px;border-top:1px solid var(--rule);padding-top:10px;}  .comments-section.open{display:block;}  .comment-item{background:var(--surface2);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12px;}  .comment-item .c-author{font-weight:bold;color:var(--gold);font-size:11px;}  .comment-item.admin-reply{border-left:3px solid var(--gold);}  .comment-input-row{display:flex;gap:6px;margin-top:8px;}  .comment-input-row input{margin-bottom:0;flex:1;padding:9px;font-size:13px;}  .comment-input-row button{width:auto;padding:9px 12px;font-size:12px;}  /* Chat */  .chat-box{display:flex;flex-direction:column;height:60vh;}  .chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px 12px;}  .chat-bubble{max-width:78%;padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.4;}  .chat-bubble.me{align-self:flex-end;background:var(--gold);color:#ffffff;border-bottom-right-radius:2px;}  .chat-bubble.admin{align-self:flex-start;background:var(--surface);border:1px solid var(--rule);border-bottom-left-radius:2px;}  .chat-input-row{display:flex;gap:8px;}  .chat-input-row input{margin-bottom:0;flex:1;}  .chat-input-row button{width:auto;padding:13px 16px;}  /* Profile */  .profile-box{text-align:center;padding:10px 0;}  .profile-photo-wrap{width:110px;height:110px;margin:0 auto;border-radius:50%;overflow:hidden;    border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;background:var(--surface2);}  .profile-photo-wrap img{width:100%;height:100%;object-fit:cover;}  .profile-placeholder{font-size:36px;color:var(--gold);}  .profile-info{margin-top:22px;text-align:left;}  .profile-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule);font-size:13px;}  .profile-row span{color:var(--muted);}</style></head><body><div class="wrap">  <header>    <h1>Movie Library</h1>    <div class="sub">Karibu Dukani</div>  </header>  <!-- AUTH -->  <div id="authBox" class="auth-box">    <div id="loginForm">      <p>Ingia kwenye akaunti yako</p>      <input type="email" id="loginEmail" placeholder="Barua pepe">      <input type="password" id="loginPass" placeholder="Password">      <button class="btn" id="loginBtn">Ingia</button>      <span class="link-toggle" id="showRegister">Huna akaunti? Jisajili</span><br>      <span class="link-toggle" id="forgotPassBtn">Umesahau Password?</span>      <div class="msg" id="authMsg"></div>    </div>    <div id="registerForm" style="display:none;">      <p>Jisajili (mara moja tu)</p>      <input type="text" id="regName" placeholder="Jina lako">      <input type="email" id="regEmail" placeholder="Barua pepe">      <input type="password" id="regPass" placeholder="Password (angalau herufi 6)">      <button class="btn" id="registerBtn">Jisajili</button>      <span class="link-toggle" id="showLogin">Una akaunti? Ingia</span>      <div class="msg" id="regMsg"></div>    </div>  </div>  <!-- BANNED -->  <div id="bannedBox" class="banned-box" style="display:none;">    Akaunti yako imefungwa. Wasiliana na Admin kwa maelezo zaidi.  </div>  <!-- APP -->  <div id="app" style="display:none;">    <div class="logout-bar">      <div class="topbar-avatar" id="topbarAvatar">        <img id="topbarAvatarImg" src="" style="display:none;">        <div id="topbarAvatarPlaceholder" class="topbar-placeholder">?</div>        <span class="topbar-name" id="topbarName"></span>      </div>      <button id="logoutBtn">Toka &rarr;</button>    </div>    <main>      <div class="tabs">        <button class="tab-btn active" data-tab="movies">Movies</button>        <button class="tab-btn" data-tab="products">Bidhaa</button>        <button class="tab-btn" data-tab="chat">Chat</button>        <button class="tab-btn" data-tab="profile">Profile</button>      </div>      <div class="section active" id="tab-movies">        <div id="adsSection"></div>        <div id="topMoviesSection"></div>        <div class="search-wrap">          <input type="text" id="searchInput" placeholder="Tafuta jina la movie...">        </div>        <div class="cat-scroll" id="branchScroll"></div>        <div class="cat-scroll" id="catScroll"></div>        <div id="movieList"></div>      </div>      <div class="section" id="tab-products">        <div id="productList"></div>      </div>      <div class="section" id="tab-chat">        <div class="chat-box">          <div id="chatMessages" class="chat-messages"></div>          <div class="chat-input-row">            <input type="text" id="chatInput" placeholder="Andika ujumbe kwa Reelzone...">            <button class="btn small" id="chatSendBtn" style="width:auto;">Tuma</button>          </div>        </div>      </div>      <div class="section" id="tab-profile">        <div class="profile-box">          <div class="profile-photo-wrap">            <img id="profilePhotoImg" src="" style="display:none;">            <div id="profilePhotoPlaceholder" class="profile-placeholder">?</div>          </div>          <input type="file" id="profilePhotoInput" accept="image/*" style="margin-top:14px;">          <button class="btn secondary" id="profilePhotoBtn">Badilisha Picha ya Profile</button>          <div class="profile-info">            <div class="profile-row"><span>Jina</span><strong id="profileName"></strong></div>            <div class="profile-row"><span>Barua pepe</span><strong id="profileEmail"></strong></div>          </div>          <input type="text" id="profileNameInput" placeholder="Andika jina jipya" style="margin-top:14px;">          <button class="btn secondary" id="profileNameBtn">Badilisha Jina</button>        </div>      </div>    </main>  </div></div><div class="modal-overlay" id="trailerModal">  <div class="modal-box">    <button class="modal-close" id="closeTrailer">&times;</button>    <div id="trailerFrameHolder"></div>  </div></div><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import {  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,  onAuthStateChanged, signOut, sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import {  getFirestore, collection, doc, setDoc, getDoc, updateDoc,  onSnapshot, query, orderBy, where, arrayUnion, arrayRemove, increment,  addDoc, serverTimestamp, limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";// ============================================// CONFIG - IMEUNGANISHWA MOJA KWA MOJA (hakuna faili nyingine inayohitajika)// ============================================const firebaseConfig = {  apiKey: "AIzaSyAc9-UB8dja2Bf0PYL72wDI3sOC7eL_02o",  authDomain: "reelzone-muvies.firebaseapp.com",  projectId: "reelzone-muvies",  storageBucket: "reelzone-muvies.firebasestorage.app",  messagingSenderId: "930079836592",  appId: "1:930079836592:web:25ce8aa2d4d464c3522e75"};const IMGBB_API_KEY = "eabab407ec137007c21922ef7abe9f98";async function compressImage(file, maxWidth = 700, quality = 0.7) {  return new Promise((resolve, reject) => {    const img = new Image();    const reader = new FileReader();    reader.onload = (e) => { img.src = e.target.result; };    reader.onerror = reject;    img.onload = () => {      const scale = Math.min(1, maxWidth / img.width);      const canvas = document.createElement('canvas');      canvas.width = img.width * scale;      canvas.height = img.height * scale;      const ctx = canvas.getContext('2d');      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);      canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);    };    img.onerror = reject;    reader.readAsDataURL(file);  });}async function uploadImage(file) {  let toSend = file;  try { toSend = await compressImage(file); } catch (e) { toSend = file; }  const url = `https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`;  const formData = new FormData();  formData.append('image', toSend);  const res = await fetch(url, { method: 'POST', body: formData });  const data = await res.json().catch(() => null);  if (!res.ok || !data || !data.success) {    throw new Error('Imeshindwa kupakia picha. Jaribu tena.');  }  return data.data.url;}const app = initializeApp(firebaseConfig);const auth = getAuth(app);const db = getFirestore(app);let categories = [];let branches = [];let allMovies = [];let activeCategory = 'zote';let activeBranch = 'zote';let currentUid = null;let currentUserName = '';let currentUserEmail = '';let currentUserPhoto = '';let likedMovies = [];// ---- TOGGLE LOGIN / REGISTER ----document.getElementById('showRegister').addEventListener('click', () => {  document.getElementById('loginForm').style.display = 'none';  document.getElementById('registerForm').style.display = 'block';});document.getElementById('showLogin').addEventListener('click', () => {  document.getElementById('registerForm').style.display = 'none';  document.getElementById('loginForm').style.display = 'block';});// ---- REGISTER ----document.getElementById('registerBtn').addEventListener('click', async () => {  const name = document.getElementById('regName').value.trim();  const email = document.getElementById('regEmail').value.trim();  const pass = document.getElementById('regPass').value;  const msg = document.getElementById('regMsg');  if (!name || !email || pass.length < 6) {    msg.textContent = 'Jaza jina, email na password (herufi 6+).';    return;  }  try {    const cred = await createUserWithEmailAndPassword(auth, email, pass);    await setDoc(doc(db, 'users', cred.user.uid), {      name, email, banned: false, likes: [], createdAt: new Date()    });  } catch (e) {    msg.textContent = 'Imeshindikana: ' + e.message;  }});// ---- LOGIN ----document.getElementById('loginBtn').addEventListener('click', async () => {  const email = document.getElementById('loginEmail').value.trim();  const pass = document.getElementById('loginPass').value;  const msg = document.getElementById('authMsg');  try {    await signInWithEmailAndPassword(auth, email, pass);  } catch (e) {    msg.textContent = 'Email au password si sahihi.';  }});document.getElementById('forgotPassBtn').addEventListener('click', async () => {  const email = document.getElementById('loginEmail').value.trim();  const msg = document.getElementById('authMsg');  if (!email) {    msg.textContent = 'Weka email yako kwenye kisanduku hapo juu kwanza, kisha bonyeza tena.';    return;  }  try {    await sendPasswordResetEmail(auth, email);    msg.style.color = 'var(--ok, #4caf6d)';    msg.textContent = 'Tumetuma link ya kubadili password kwenye email yako.';  } catch (e) {    msg.style.color = '';    msg.textContent = 'Imeshindwa kutuma: hakikisha email ni sahihi.';  }});document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));// ---- AUTH STATE ----onAuthStateChanged(auth, async (user) => {  if (user) {    const userDoc = await getDoc(doc(db, 'users', user.uid));    const userData = userDoc.exists() ? userDoc.data() : {};    currentUid = user.uid;    likedMovies = userData.likes || [];    currentUserName = userData.name || '';    currentUserEmail = userData.email || user.email || '';    currentUserPhoto = userData.photoUrl || '';    if (userData.banned) {      document.getElementById('authBox').style.display = 'none';      document.getElementById('app').style.display = 'none';      document.getElementById('bannedBox').style.display = 'block';      return;    }    document.getElementById('authBox').style.display = 'none';    document.getElementById('bannedBox').style.display = 'none';    document.getElementById('app').style.display = 'block';    renderProfile();    initListeners();  } else {    currentUid = null;    document.getElementById('authBox').style.display = 'block';    document.getElementById('bannedBox').style.display = 'none';    document.getElementById('app').style.display = 'none';  }});// ---- TABS ----document.querySelectorAll('.tab-btn').forEach(btn => {  btn.addEventListener('click', () => {    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));    btn.classList.add('active');    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');  });});let listenersInitialized = false;function initListeners() {  if (listenersInitialized) return;  listenersInitialized = true;  listenCategories();  listenBranches();  listenMovies();  listenProducts();  listenAds();  listenChat();}// ---- BRANCHES (OFISI) ----function listenBranches() {  const q = query(collection(db, 'branches'), orderBy('name'));  onSnapshot(q, (snap) => {    branches = [];    snap.forEach(d => {      const data = d.data();      // Ofisi mpya inaanza ikiwa imefungwa - inaonekana tu Admin akiifungua waziwazi.      if (data.enabled === true) branches.push({ id: d.id, ...data });    });    renderBranchChips();    renderMovies();  });}function renderBranchChips() {  const scroll = document.getElementById('branchScroll');  if (branches.length === 0) { scroll.innerHTML = ''; return; }  const chips = [{ id: 'zote', name: 'Ofisi Zote' }, ...branches];  scroll.innerHTML = chips.map(b => `    <div class="cat-chip ${activeBranch === b.id ? 'active' : ''}" data-branch="${b.id}">${escapeHtml(b.name)}</div>  `).join('');  scroll.querySelectorAll('.cat-chip').forEach(chip => {    chip.addEventListener('click', () => {      activeBranch = chip.dataset.branch;      renderBranchChips();      renderMovies();    });  });}// ---- CATEGORIES ----function listenCategories() {  const q = query(collection(db, 'categories'), orderBy('name'));  onSnapshot(q, (snap) => {    categories = [];    snap.forEach(d => {      const data = d.data();      // Category inaonekana isipokuwa imefungwa waziwazi (enabled === false).      // Hii inaepusha tatizo la category kukosa field ya 'enabled' na kutoweka kimya kimya.      if (data.enabled !== false) categories.push({ id: d.id, ...data });    });    renderCategoryChips();    renderMovies();  });}function renderCategoryChips() {  const scroll = document.getElementById('catScroll');  const chips = [{ id: 'zote', name: 'Zote' }, ...categories];  scroll.innerHTML = chips.map(c => `    <div class="cat-chip ${activeCategory === c.id ? 'active' : ''}" data-cat="${c.id}">${escapeHtml(c.name)}</div>  `).join('');  scroll.querySelectorAll('.cat-chip').forEach(chip => {    chip.addEventListener('click', () => {      activeCategory = chip.dataset.cat;      renderCategoryChips();      renderMovies();    });  });}// ---- MOVIES ----function listenMovies() {  const q = query(collection(db, 'movies'), orderBy('createdAt', 'desc'));  onSnapshot(q, (snap) => {    allMovies = [];    snap.forEach(d => allMovies.push({ id: d.id, ...d.data() }));    renderMovies();    renderTopMovies();  });}document.getElementById('searchInput').addEventListener('input', renderMovies);function statusLabel(s) {  if (s === 'ipo') return { text: 'IPO', cls: 'ipo' };  if (s === 'bado') return { text: 'BADO', cls: 'bado' };  return { text: 'INAKUJA', cls: 'inakuja' };}function renderTopMovies() {  const holder = document.getElementById('topMoviesSection');  const enabledCatIds = categories.map(c => c.id);  const enabledBranchIds = branches.map(b => b.id);  let top = allMovies    .filter(m => enabledCatIds.includes(m.category) && enabledBranchIds.includes(m.branch) && (m.likes || 0) > 0);  if (activeBranch !== 'zote') top = top.filter(m => m.branch === activeBranch);  top = top    .sort((a, b) => (b.likes || 0) - (a.likes || 0))    .slice(0, 8);  if (top.length === 0) { holder.innerHTML = ''; return; }  holder.innerHTML = `    <div class="section-label">Movies Bora za Wiki</div>    <div class="top-scroll">      ${top.map((m, i) => `        <div class="top-card">          <span class="rank-badge">${i + 1}</span>          ${m.imageUrl ? `<img src="${m.imageUrl}">` : ''}          <div class="top-title">${escapeHtml(m.title)}</div>          <div class="top-likes">\u2665 ${m.likes || 0}</div>        </div>      `).join('')}    </div>  `;}function renderMovies() {  const search = document.getElementById('searchInput').value.trim().toLowerCase();  const enabledCatIds = categories.map(c => c.id);  const enabledBranchIds = branches.map(b => b.id);  let filtered = allMovies.filter(m => enabledCatIds.includes(m.category) && enabledBranchIds.includes(m.branch));  if (activeCategory !== 'zote') filtered = filtered.filter(m => m.category === activeCategory);  if (activeBranch !== 'zote') filtered = filtered.filter(m => m.branch === activeBranch);  if (search) filtered = filtered.filter(m => m.title.toLowerCase().includes(search));  const list = document.getElementById('movieList');  if (filtered.length === 0) {    list.innerHTML = '<div class="empty">Hakuna movie iliyopatikana.</div>';    return;  }  list.innerHTML = filtered.map(m => {    const s = statusLabel(m.status);    const isLiked = likedMovies.includes(m.id);    return `<div class="card">      ${m.imageUrl ? `<img class="thumb" src="${m.imageUrl}">` : ''}      <div class="card-top">        <div class="card-title">${escapeHtml(m.title)}</div>        <span class="stamp ${s.cls}">${s.text}</span>      </div>      ${m.description ? `<div class="card-desc">${escapeHtml(m.description)}</div>` : ''}      <div class="actions-row">        <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${m.id}', this)">          <span class="heart-icon">${isLiked ? '\u2764\ufe0f' : '\u2661'}</span> <span>${m.likes || 0}</span>        </button>        ${m.trailerId ? `<button class="trailer-btn" onclick="playTrailer('${m.trailerId}')">&#9654; Tazama Trailer</button>` : ''}        <button class="share-btn" onclick='shareMovie(${JSON.stringify(m.title)})'>&#8593; Share</button>      </div>      ${renderCommentsBlock(m.id)}    </div>`;  }).join('');}function renderCommentsBlock(movieId) {  const isOpen = !!openComments[movieId];  const comments = openComments[movieId] || [];  return `    <button class="comments-toggle" onclick="toggleComments('${movieId}')">${isOpen ? 'Ficha Maoni' : 'Ona / Ongeza Maoni'}</button>    <div class="comments-section ${isOpen ? 'open' : ''}">      ${comments.length === 0 ? '<div style="color:var(--muted);font-size:12px;">Bado hakuna maoni. Kuwa wa kwanza!</div>' : ''}      ${comments.map(c => `        <div class="comment-item ${c.isAdmin ? 'admin-reply' : ''}">          <div class="c-author">${c.isAdmin ? '\u2605 Reelzone (Admin)' : escapeHtml(c.userName || 'Mteja')}</div>          <div>${escapeHtml(c.text)}</div>        </div>      `).join('')}      <div class="comment-input-row">        <input type="text" id="commentInput-${movieId}" placeholder="Andika maoni yako...">        <button class="btn small" onclick="submitComment('${movieId}')">Tuma</button>      </div>    </div>  `;}let openComments = {};let commentUnsub = {};window.toggleComments = (movieId) => {  if (openComments[movieId]) {    delete openComments[movieId];    if (commentUnsub[movieId]) { commentUnsub[movieId](); delete commentUnsub[movieId]; }    renderMovies();    return;  }  openComments[movieId] = [];  const q = query(collection(db, 'movies', movieId, 'comments'), orderBy('createdAt', 'asc'));  commentUnsub[movieId] = onSnapshot(q, (snap) => {    const arr = [];    snap.forEach(d => arr.push({ id: d.id, ...d.data() }));    openComments[movieId] = arr;    renderMovies();  });  renderMovies();};window.submitComment = async (movieId) => {  const input = document.getElementById('commentInput-' + movieId);  const text = input.value.trim();  if (!text || !currentUid) return;  input.value = '';  try {    await addDoc(collection(db, 'movies', movieId, 'comments'), {      text, uid: currentUid, userName: currentUserName || 'Mteja', isAdmin: false, createdAt: serverTimestamp()    });  } catch (e) {    input.value = text;    alert('Imeshindwa kutuma maoni. Angalia mtandao wako kisha jaribu tena.');  }};window.shareMovie = async (title) => {  const shareText = `Angalia "${title}" kwenye Reelzone Muvies!`;  const shareUrl = window.location.href;  try {    if (navigator.share) {      await navigator.share({ title: 'Reelzone Muvies', text: shareText, url: shareUrl });    } else {      await navigator.clipboard.writeText(shareText + ' ' + shareUrl);      alert('Maandishi ya kushea yamenakiliwa. Sasa bandika popote unapotaka kutuma (WhatsApp, Status, n.k.)');    }  } catch (e) { /* mtumiaji amesitisha, hakuna tatizo */ }};window.toggleLike = async (movieId, btnEl) => {  if (!currentUid) return;  const isLiked = likedMovies.includes(movieId);  const userRef = doc(db, 'users', currentUid);  const movieRef = doc(db, 'movies', movieId);  try {    if (isLiked) {      await updateDoc(userRef, { likes: arrayRemove(movieId) });      await updateDoc(movieRef, { likes: increment(-1) });      likedMovies = likedMovies.filter(id => id !== movieId);    } else {      await updateDoc(userRef, { likes: arrayUnion(movieId) });      await updateDoc(movieRef, { likes: increment(1) });      likedMovies.push(movieId);      if (btnEl) {        btnEl.classList.add('pop');        setTimeout(() => btnEl.classList.remove('pop'), 400);      }    }  } catch (e) {    alert('Imeshindwa. Angalia mtandao wako kisha jaribu tena.');  }  renderMovies();};// ---- ANNOUNCEMENTS (TANGAZO) ----function listenAds() {  const q = query(collection(db, 'announcements'), orderBy('createdAt', 'desc'));  onSnapshot(q, (snap) => {    const ads = [];    snap.forEach(d => ads.push({ id: d.id, ...d.data() }));    renderAds(ads);  });}function renderAds(ads) {  const holder = document.getElementById('adsSection');  if (ads.length === 0) { holder.innerHTML = ''; return; }  const emergencyAds = ads.filter(a => a.type === 'emergency');  const imageAds = ads.filter(a => a.type === 'image');  const textAds = ads.filter(a => a.type === 'text');  let html = '';  emergencyAds.forEach(a => {    html += `<div class="emergency-banner"><span class="icon">\u26A0\uFE0F</span><div>${escapeHtml(a.text)}</div></div>`;  });  if (imageAds.length > 0) {    html += `<div class="ads-scroll">      ${imageAds.map(a => `        <div class="ad-card">          <img src="${a.imageUrl}">          ${a.text ? `<div class="ad-text">${escapeHtml(a.text)}</div>` : ''}        </div>      `).join('')}    </div>`;  }  textAds.forEach(a => {    html += `<div class="ad-text-only">${escapeHtml(a.text)}</div>`;  });  holder.innerHTML = html;}// ---- PRODUCTS ----function listenProducts() {  const q = query(collection(db, 'products'), orderBy('createdAt', 'desc'));  onSnapshot(q, (snap) => {    const products = [];    snap.forEach(d => products.push({ id: d.id, ...d.data() }));    renderProducts(products);  });}function renderProducts(products) {  const list = document.getElementById('productList');  if (products.length === 0) {    list.innerHTML = '<div class="empty">Bado hakuna bidhaa.</div>';    return;  }  list.innerHTML = products.map(p => `    <div class="card">      ${p.imageUrl ? `<img class="thumb" src="${p.imageUrl}">` : ''}      <div class="card-top">        <div class="card-title">${escapeHtml(p.name)}</div>        <span class="stamp ipo" style="color:var(--gold);border-color:var(--gold-dim);">TZS ${Number(p.price).toLocaleString()}</span>      </div>      ${p.description ? `<div class="card-desc">${escapeHtml(p.description)}</div>` : ''}    </div>  `).join('');}window.playTrailer = (videoId) => {  const holder = document.getElementById('trailerFrameHolder');  holder.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1"    allow="autoplay; encrypted-media" allowfullscreen></iframe>`;  document.getElementById('trailerModal').classList.add('open');};function closeTrailerModal() {  document.getElementById('trailerModal').classList.remove('open');  document.getElementById('trailerFrameHolder').innerHTML = '';}document.getElementById('closeTrailer').addEventListener('click', closeTrailerModal);document.getElementById('trailerModal').addEventListener('click', (e) => {  if (e.target.id === 'trailerModal') closeTrailerModal();});// ---- CHAT NA ADMIN ----function listenChat() {  if (!currentUid) return;  const q = query(collection(db, 'chats', currentUid, 'messages'), orderBy('createdAt', 'asc'), limit(200));  onSnapshot(q, (snap) => {    const msgs = [];    snap.forEach(d => msgs.push({ id: d.id, ...d.data() }));    renderChat(msgs);  });}function renderChat(msgs) {  const holder = document.getElementById('chatMessages');  if (msgs.length === 0) {    holder.innerHTML = '<div class="empty">Anza mazungumzo na Reelzone hapa chini.</div>';    return;  }  holder.innerHTML = msgs.map(m => `    <div class="chat-bubble ${m.sender === 'admin' ? 'admin' : 'me'}">${escapeHtml(m.text)}</div>  `).join('');  holder.scrollTop = holder.scrollHeight;}document.getElementById('chatSendBtn').addEventListener('click', sendChatMessage);document.getElementById('chatInput').addEventListener('keydown', (e) => {  if (e.key === 'Enter') sendChatMessage();});async function sendChatMessage() {  const input = document.getElementById('chatInput');  const text = input.value.trim();  if (!text || !currentUid) return;  input.value = '';  await addDoc(collection(db, 'chats', currentUid, 'messages'), {    text, sender: 'user', createdAt: serverTimestamp()  });  await setDoc(doc(db, 'chats', currentUid), {    userName: currentUserName, userEmail: currentUserEmail, lastMessage: text, lastAt: serverTimestamp()  }, { merge: true });}// ---- PROFILE ----function renderProfile() {  document.getElementById('profileName').textContent = currentUserName || '-';  document.getElementById('profileEmail').textContent = currentUserEmail || '-';  const img = document.getElementById('profilePhotoImg');  const placeholder = document.getElementById('profilePhotoPlaceholder');  const topImg = document.getElementById('topbarAvatarImg');  const topPlaceholder = document.getElementById('topbarAvatarPlaceholder');  document.getElementById('topbarName').textContent = currentUserName || '';  if (currentUserPhoto) {    img.src = currentUserPhoto;    img.style.display = 'block';    placeholder.style.display = 'none';    topImg.src = currentUserPhoto;    topImg.style.display = 'block';    topPlaceholder.style.display = 'none';  } else {    img.style.display = 'none';    placeholder.style.display = 'flex';    placeholder.textContent = (currentUserName || '?').charAt(0).toUpperCase();    topImg.style.display = 'none';    topPlaceholder.style.display = 'flex';    topPlaceholder.textContent = (currentUserName || '?').charAt(0).toUpperCase();  }}document.getElementById('topbarAvatar').addEventListener('click', () => {  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));  const profileBtn = document.querySelector('.tab-btn[data-tab="profile"]');  if (profileBtn) profileBtn.classList.add('active');  document.getElementById('tab-profile').classList.add('active');});document.getElementById('profilePhotoBtn').addEventListener('click', async () => {  const fileInput = document.getElementById('profilePhotoInput');  const file = fileInput.files[0];  if (!file) return alert('Chagua picha kwanza.');  const btn = document.getElementById('profilePhotoBtn');  const originalText = btn.textContent;  btn.disabled = true;  btn.textContent = 'Inapakia...';  try {    const url = await uploadImage(file);    await updateDoc(doc(db, 'users', currentUid), { photoUrl: url });    currentUserPhoto = url;    renderProfile();    fileInput.value = '';  } catch (e) {    alert(e.message);  }  btn.disabled = false;  btn.textContent = originalText;});document.getElementById('profileNameBtn').addEventListener('click', async () => {  const input = document.getElementById('profileNameInput');  const newName = input.value.trim();  if (!newName) return alert('Andika jina jipya kwanza.');  const btn = document.getElementById('profileNameBtn');  const originalText = btn.textContent;  btn.disabled = true;  btn.textContent = 'Inahifadhi...';  try {    await updateDoc(doc(db, 'users', currentUid), { name: newName });    currentUserName = newName;    renderProfile();    input.value = '';  } catch (e) {    alert('Imeshindwa kubadilisha jina. Jaribu tena.');  }  btn.disabled = false;  btn.textContent = originalText;});function escapeHtml(str) {  const d = document.createElement('div');  d.textContent = str || '';  return d.innerHTML;}</script></body></html>
